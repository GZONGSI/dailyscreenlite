[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyscreen-lite"
version = "0.1.0"
description = "DailyScreen Lite：候选导入与逐股研究工作台（本机首版）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "python-multipart==0.0.20",
    "openpyxl==3.1.5",
    "tzdata==2026.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "httpx==0.28.1", "duckdb==1.5.4"]

[project.scripts]
dailyscreen-lite = "dailyscreen_lite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
