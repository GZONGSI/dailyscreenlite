<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyScreen Lite</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=blue-gold-wing" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=blue-gold-wing" />
    <script>
      try {
        const theme = localStorage.getItem("dslite-theme");
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" ||
            (theme === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
